{% extends "base/layout.html" %}
{% block content %}
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Posts</h2>
    <a href="{{ url_for('posts.create_post') }}" class="btn btn-primary">Create Post</a>
  </div>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Slug</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for post in posts %}
      <tr>
        <td>{{ post.id }}</td>
        <td>{{ post.title }}</td>
        <td>{{ post.slug }}</td>
        <td>
          <a href="{{ url_for('posts.edit_post', post_id=post.id) }}" class="btn btn-sm btn-warning">Edit</a>
          <form action="{{ url_for('posts.delete_post', post_id=post.id) }}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this post?');">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
