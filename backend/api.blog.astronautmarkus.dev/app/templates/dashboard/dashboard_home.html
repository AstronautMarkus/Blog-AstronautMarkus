{% extends "base/layout.html" %}
{% block content %}
<div class="container mt-5">
  <div class="row g-4">
    <div class="col-md-3">
      <a class="card w-100 text-start border-0 shadow-sm" href="{{ url_for('posts.list_posts') }}">
        <div class="card-body d-flex align-items-center">
          <span class="me-3 fs-2 text-primary">
            <i class="fa-regular fa-file-lines"></i>
          </span>
          <div>
            <h5 class="card-title mb-1">Posts</h5>
            <p class="card-text mb-0">Total posts</p>
            <span class="fs-4 fw-bold text-primary">{{ posts|length }}</span>
          </div>
        </div>
      </a>
    </div>
    <div class="col-md-3">
      <button class="card w-100 text-start border-0 shadow-sm" type="button">
        <div class="card-body d-flex align-items-center">
          <span class="me-3 fs-2 text-success">
            <i class="fa-solid fa-chart-line"></i>
          </span>
          <div>
            <h5 class="card-title mb-1">Visits</h5>
            <p class="card-text mb-0">Total visits</p>
            <span class="fs-4 fw-bold text-success">0</span>
          </div>
        </div>
      </button>
    </div>
    <div class="col-md-3">
      <button class="card w-100 text-start border-0 shadow-sm" type="button">
        <div class="card-body d-flex align-items-center">
          <span class="me-3 fs-2 text-warning">
            <i class="fa-solid fa-users"></i>
          </span>
          <div>
            <h5 class="card-title mb-1">Users</h5>
            <p class="card-text mb-0">Total users</p>
            <span class="fs-4 fw-bold text-warning">0</span>
          </div>
        </div>
      </button>
    </div>
    <div class="col-md-3">
      <button class="card w-100 text-start border-0 shadow-sm" type="button">
        <div class="card-body d-flex align-items-center">
          <span class="me-3 fs-2 text-secondary">
            <i class="fa-regular fa-circle-question"></i>
          </span>
          <div>
            <h5 class="card-title mb-1">Lorem Ipsum</h5>
            <p class="card-text mb-0">Example text</p>
            <span class="fs-4 fw-bold text-secondary">0</span>
          </div>
        </div>
      </button>
    </div>
  </div>
</div>
{% endblock %}
